name: Publish

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    # GitHub Actions filters are globs; Firehose performs the semver validation.
    tags: ['*-v*']

jobs:
  publish:
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@main
    with:
      sdk: stable
      ignore-packages: >-
        packages/react_router_dom,
        examples/**,
        tool/vendor/**,
        third_party/**
    permissions:
      id-token: write
      pull-requests: write
