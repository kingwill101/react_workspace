name: Publish

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    # GitHub Actions filters are globs; Firehose performs the semver validation.
    tags: ['*-v*']

jobs:
  publish:
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@main
    with:
      sdk: stable
      ignore-packages: >-
        packages/react_analysis,
        packages/react_analyzer,
        packages/react_bloc,
        packages/react_codegen,
        packages/react_router,
        packages/react_server_routed,
        packages/react_testing,
        packages/react_tool,
        packages/react_web_generator,
        packages/react_zustand,
        packages/react_riverpod,
        examples/**,
        tool/vendor/**,
        third_party/**
    permissions:
      id-token: write
      pull-requests: write
