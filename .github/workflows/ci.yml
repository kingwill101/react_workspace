name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Dagger
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "0.21.8"

      - name: Run the local and remote validation contract
        run: ./tool/ci.sh all
