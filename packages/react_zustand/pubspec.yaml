name: react_zustand
description: Typed bindings for the zustand state-management library.
version: 0.0.1
repository: https://github.com/kingwill101/react_workspace/tree/master/packages/react_zustand
resolution: workspace
environment:
  sdk: ">=3.12.0 <4.0.0"
# The react.js descriptor declares the wrapper's JavaScript contract. `react
# build` provisions an isolated npm environment and bundles this entry into
# per-target aggregates whenever this package is a dependency, so projects
# only need to add the package — no react.yaml edits.
react:
  js:
    schema: 1
    entries:
      shared: lib/react_zustand_shim.mjs
    dependencies:
      zustand: ^5.0.2
    peers:
      react: ">=18 <20"
      react-dom: ">=18 <20"
    externals:
      - react
      - react-dom
dependencies:
  react: ^0.1.0
dev_dependencies:
  test: ^1.31.2
