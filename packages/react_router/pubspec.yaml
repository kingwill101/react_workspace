name: react_router
description: Typed React Router bindings for React Dart applications.
version: 0.0.1
publish_to: none
resolution: workspace
environment:
  sdk: ">=3.12.0 <4.0.0"
# The react.js descriptor declares the wrapper's JavaScript contract. `react
# build` provisions an isolated npm environment and bundles this entry into
# per-target aggregates whenever this package is a dependency, so projects
# only need to add the package — no react.yaml edits.
react:
  js:
    schema: 1
    # `react ts bind` (no arguments) regenerates these groups. `names` is
    # omitted so the extractor discovers the exported components and hooks
    # itself, filtering out exports that don't return a React node.
    bind:
      - specifier: react-router-dom
        output: lib/react_router_bindings.g.dart
        shim: lib/react_router_bindings_shim.mjs
        hooks: lib/react_router_hooks.g.dart
        namespace: reactRouter
        prefix: reactRouter
      - specifier: react-router-dom/server
        output: lib/react_router_server_bindings.g.dart
        shim: lib/react_router_server_shim.mjs
        prefix: reactRouter
        # Keeps the server file's generated types distinct from the main
        # file's (both extract `FutureConfig` from react-router-dom).
        typePrefix: Server
    entries:
      browser: lib/react_router_bindings_shim.mjs
      ssr: lib/react_router_shim.mjs
    dependencies:
      react-router-dom: ^6.26.2
    peers:
      react: ">=18 <20"
      react-dom: ">=18 <20"
    externals:
      - react
      - react-dom
dependencies:
  react: {path: ../react}
dev_dependencies:
  react_tool: {path: ../react_tool}
  test: ^1.31.2
