build:
  recipes:
    - target:
        os: linux
        architecture: x64
      steps:
        - id: cargo-build
          type: command
          working_directory: .
          commands:
            - [cargo, build, --release, --manifest-path, native/Cargo.toml]
        - id: export
          type: export_artifact
          artifact: react_ts_bindings
          kind: dynamic_library
          primary: native/target/release/libreact_ts_bindings.so
    - target:
        os: linux
        architecture: arm64
      steps:
        - id: cargo-build
          type: command
          working_directory: .
          commands:
            - [cargo, build, --release, --manifest-path, native/Cargo.toml]
        - id: export
          type: export_artifact
          artifact: react_ts_bindings
          kind: dynamic_library
          primary: native/target/release/libreact_ts_bindings.so
    - target:
        os: macos
        architecture: x64
      steps:
        - id: cargo-build
          type: command
          working_directory: .
          commands:
            - [cargo, build, --release, --manifest-path, native/Cargo.toml]
        - id: export
          type: export_artifact
          artifact: react_ts_bindings
          kind: dynamic_library
          primary: native/target/release/libreact_ts_bindings.dylib
    - target:
        os: macos
        architecture: arm64
      steps:
        - id: cargo-build
          type: command
          working_directory: .
          commands:
            - [cargo, build, --release, --manifest-path, native/Cargo.toml]
        - id: export
          type: export_artifact
          artifact: react_ts_bindings
          kind: dynamic_library
          primary: native/target/release/libreact_ts_bindings.dylib
    - target:
        os: windows
        architecture: x64
      steps:
        - id: cargo-build
          type: command
          working_directory: .
          commands:
            - [cargo, build, --release, --manifest-path, native/Cargo.toml]
        - id: copy-artifact
          type: command
          working_directory: .
          commands:
            - [pwsh, -NoProfile, -Command, "New-Item -ItemType Directory -Force -Path 'native/target/release'; Copy-Item -Force 'D:/cargo-target/release/react_ts_bindings.dll' 'native/target/release/react_ts_bindings.dll'"]
        - id: export
          type: export_artifact
          artifact: react_ts_bindings
          kind: dynamic_library
          primary: native/target/release/react_ts_bindings.dll
    - target:
        os: windows
        architecture: arm64
      steps:
        - id: cargo-build
          type: command
          working_directory: .
          commands:
            - [cargo, build, --release, --target, aarch64-pc-windows-msvc, --manifest-path, native/Cargo.toml]
        - id: copy-artifact
          type: command
          working_directory: .
          commands:
            - [pwsh, -NoProfile, -Command, "New-Item -ItemType Directory -Force -Path 'native/target/aarch64-pc-windows-msvc/release'; Copy-Item -Force 'D:/cargo-target/aarch64-pc-windows-msvc/release/react_ts_bindings.dll' 'native/target/aarch64-pc-windows-msvc/release/react_ts_bindings.dll'"]
        - id: export
          type: export_artifact
          artifact: react_ts_bindings
          kind: dynamic_library
          primary: native/target/aarch64-pc-windows-msvc/release/react_ts_bindings.dll
