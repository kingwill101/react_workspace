client:
  entrypoint: web/client.dart
styles:
  entrypoints:
    - web/styles.generated.css
  output: styles.css

foreign:
  components:
    - name: shadcn.Button
      module: web/components/ui/button.tsx
      export: Button
      props:
        variant: String?
        size: String?
        className: String?
        disabled: bool?
        onClick: Function?
    - name: shadcn.Card
      module: web/components/ui/card.tsx
      export: Card
      props:
        className: String?

    - name: 'shadcn.Textarea'
      module: 'web/components/ui/textarea.tsx'
      export: 'Textarea'
      props:
        className: String?
        placeholder: String?
        disabled: bool?
        id: String?
        dir: String?
        rows: num?

    - name: 'shadcn.Field'
      module: 'web/components/ui/field.tsx'
      export: 'Field'
      props:
        className: 'String?'
        dir: 'String?'
    - name: 'shadcn.FieldLabel'
      module: 'web/components/ui/field.tsx'
      export: 'FieldLabel'
      props:
        className: 'String?'
        dir: 'String?'
        htmlFor: 'String?'
    - name: 'shadcn.FieldDescription'
      module: 'web/components/ui/field.tsx'
      export: 'FieldDescription'
      props:
        className: 'String?'
        dir: 'String?'
