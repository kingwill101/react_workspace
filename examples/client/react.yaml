client:
  entrypoint: web/client.dart
styles:
  entrypoints:
    - web/styles.generated.css
  output: styles.css

foreign:
  # The managed JS environment is intentionally independent of the example's
  # optional npm install. Declare runtime imports used by local TSX sources so
  # clean builds and CI provision the same dependency graph.
  dependencies:
    '@radix-ui/react-label': '^2.1.15'
    '@radix-ui/react-separator': '^1.1.15'
    'class-variance-authority': '^0.7.1'
    clsx: '^2.1.1'
    'tailwind-merge': '^3.6.0'
  components:
    - name: shadcn.Button
      module: web/components/ui/button.tsx
      export: Button
      props:
        variant: String?
        size: String?
        className: String?
        disabled: bool?
        onClick: Function?
    - name: shadcn.Card
      module: web/components/ui/card.tsx
      export: Card
      props:
        className: String?

    - name: 'shadcn.Textarea'
      module: 'web/components/ui/textarea.tsx'
      export: 'Textarea'
      props:
        className: String?
        placeholder: String?
        disabled: bool?
        id: String?
        dir: String?
        rows: num?

    - name: 'shadcn.Field'
      module: 'web/components/ui/field.tsx'
      export: 'Field'
      props:
        className: 'String?'
        dir: 'String?'
    - name: 'shadcn.FieldLabel'
      module: 'web/components/ui/field.tsx'
      export: 'FieldLabel'
      props:
        className: 'String?'
        dir: 'String?'
        htmlFor: 'String?'
    - name: 'shadcn.FieldDescription'
      module: 'web/components/ui/field.tsx'
      export: 'FieldDescription'
      props:
        className: 'String?'
        dir: 'String?'
