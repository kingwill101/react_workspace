client:
  entrypoint: web/client.dart
styles:
  entrypoints:
    - web/styles.generated.css
  output: styles.css

foreign:
  components:
    - name: shadcn.Button
      module: web/components/ui/button.tsx
      export: Button
      props:
        variant: String?
        size: String?
        className: String?
        disabled: bool?
        onClick: Function?
    - name: shadcn.Card
      module: web/components/ui/card.tsx
      export: Card
      props:
        className: String?
