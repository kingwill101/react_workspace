name: plugin_validation
description: Validates react_analyzer plugin diagnostics, fixes, and runtime usage.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  react: {path: ../../packages/react}
  react_analysis: {path: ../../packages/react_analysis}
  react_web: {path: ../../packages/react_web}

dev_dependencies:
  analyzer: ">=7.0.0 <16.0.0"
  build_runner: ^2.15.3
  lints: ^6.0.0
  react_analyzer: {path: ../../packages/react_analyzer}
  react_codegen: {path: ../../packages/react_codegen}
  test: ^1.31.2
