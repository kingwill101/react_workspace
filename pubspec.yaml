name: react_workspace
environment:
  sdk: ">=3.12.0 <4.0.0"
workspace:
  - packages/react
  - packages/react_actions
  - packages/react_js
  - packages/react_dom
  - packages/react_codegen
  - packages/react_server
  - packages/react_server_shelf
  - packages/react_web
  - packages/react_web_generator
  - packages/react_tool
  - packages/react_testing
  - packages/react_router
  - packages/react_zustand
  - packages/react_riverpod
  - packages/react_bloc
  - packages/react_analysis
  - packages/react_analyzer
  - packages/react_server_routed
  - packages/react_server_routed/example
  - examples/ssr
  - examples/plugin_validation
  - examples/client
  - examples/superdesk
dependencies:
  react_server: {path: packages/react_server}
  react_tool: {path: packages/react_tool}
  example: {path: examples/ssr}
  client: {path: examples/client}
  superdesk: {path: examples/superdesk}
  shelf: ^1.4.0
  shelf_static: ^1.1.3
  watcher: ^1.1.0
dev_dependencies:
  test: ^1.31.2
  react_web_generator: any
