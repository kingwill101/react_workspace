name: react_workspace
environment:
  sdk: ">=3.12.0 <4.0.0"
workspace:
  - packages/react
  - packages/react_actions
  - packages/react_js
  - packages/react_dom
  - packages/react_codegen
  - packages/react_server
  - packages/react_web
  - packages/react_web_generator
  - packages/react_tool
  - packages/react_testing
  - packages/react_router
  - packages/react_zustand
  - example
dependencies:
  react_server: {path: packages/react_server}
  react_tool: {path: packages/react_tool}
  example: {path: example}
  shelf: ^1.4.0
  shelf_static: ^1.1.3
  watcher: ^1.1.0
dev_dependencies:
  test: ^1.31.2
  react_web_generator: any
