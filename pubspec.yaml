name: react_workspace
publish_to: none
environment:
  sdk: ">=3.12.0 <4.0.0"
workspace:
  - packages/react_core
  - packages/react_actions
  - packages/react_js
  - packages/react_dom
  - packages/react_codegen
  - packages/react_server
  - packages/react_server_shelf
  - packages/react_web
  - packages/react_web_generator
  - packages/react_tool
  - packages/react_testing
  - packages/react_router_dom
  - packages/react_zustand
  - packages/react_riverpod
  - packages/react_bloc
  - packages/react_analysis
  - packages/react_analyzer
  - packages/react_server_routed
  - packages/react_server_routed/example
  - examples/ssr
  - examples/plugin_validation
  - examples/client
  - examples/superdesk
dependencies:
  react_server: ^0.1.0
  react_tool: ^0.2.0
  example: any
  client: any
  superdesk: any
  shelf: ^1.4.0
  shelf_static: ^1.1.3
  watcher: ^1.1.0
dev_dependencies:
  test: ^1.31.2
  react_web_generator: any

# native_prebuilt 0.4.0 still declares artisanal ^0.4.0, while the workspace
# uses the compatible 0.5.x API. Keep one CLI implementation in the workspace
# until native_prebuilt widens that constraint upstream.
dependency_overrides:
  artisanal: ^0.5.0
