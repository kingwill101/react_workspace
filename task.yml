version: '3'

tasks:

  default:
    desc: Build everything (generate + ssr + client)
    cmds:
      - task: generate
      - task: ssr
      - task: client

  generate:
    desc: Run code generator and copy generated files
    cmds:
      - |
        rm -rf .dart_tool/build/generated/react_workspace/example/lib/*.react.*
        TMP=.tmp dart run build_runner build --workspace
        for f in .dart_tool/build/generated/react_workspace/example/lib/*.react.dart; do
          [ -f "$f" ] && cp "$f" example/lib/
        done
        for f in .dart_tool/build/generated/react_workspace/example/lib/*.react.g.dart; do
          [ -f "$f" ] && cp "$f" example/lib/
        done

  ssr:
    desc: Compile SSR JavaScript
    cmds:
      - rm -f build/ssr.js
      - dart compile js -O0 -o build/ssr.js example/lib/ssr.dart

  client:
    desc: Compile client JavaScript
    cmds:
      - dart compile js -O0 -o example/web/client.dart.js example/web/client.dart

  build:
    desc: Full build (generate + ssr + client)
    cmds:
      - task: generate
      - task: ssr
      - task: client

  serve:
    desc: Full build + start demo server (http://localhost:8080)
    cmds:
      - task: build
      - |
        fuser -k 3001/tcp 2>/dev/null || true
        fuser -k 8080/tcp 2>/dev/null || true
        sleep 1
        dart run bin/dev.dart

  dev:
    desc: Quick restart dev server (no rebuild)
    cmds:
      - fuser -k 3001/tcp 2>/dev/null || true
      - fuser -k 8080/tcp 2>/dev/null || true
      - sleep 1
      - node ssr_worker.mjs &
      - sleep 2
      - dart run bin/dev.dart

  analyze:
    desc: Run dart analyze
    cmds:
      - dart analyze

  clean:
    desc: Remove compiled and generated files
    cmds:
      - rm -f build/ssr.js example/web/client.dart.js
      - rm -f example/lib/*.react.dart example/lib/*.react.g.dart
      - rm -f example/lib/react_components.g.dart
      - rm -rf .dart_tool/build/generated

  status:
    desc: Show build status and test SSR
    cmds:
      - |
        echo "=== Build Status ==="
        if [ -f build/ssr.js ]; then
          echo "  SSR:  build/ssr.js ($(wc -c < build/ssr.js | tr -d ' ') bytes)"
        else
          echo "  SSR:  not built"
        fi
        if [ -f example/web/client.dart.js ]; then
          echo "  Client: example/web/client.dart.js ($(wc -c < example/web/client.dart.js | tr -d ' ') bytes)"
        else
          echo "  Client: not built"
        fi
        echo ""
        echo "=== Generated Files ==="
        ls -1 example/lib/*.react.* 2>/dev/null || echo "  (none)"
        ls -1 example/lib/react_components.g.dart 2>/dev/null || echo "  (no aggregate)"
        echo ""
        echo "=== SSR Test ==="
        curl -s -X POST http://localhost:3001 -H 'Content-Type: application/json' \
          -d '{"id":"package:react_workspace/example/lib/app.dart#App","props":{"title":"OK"}}' 2>/dev/null \
          || echo "  (SSR worker not running on port 3001)"