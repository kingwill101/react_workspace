version: '3'

tasks:

  default:
    desc: Build everything (generate + ssr + client)
    cmds:
      - task: generate
      - task: ssr
      - task: client

  generate:
    desc: Run code generator and copy generated files
    cmds:
      - |
        rm -rf .dart_tool/build/generated/react_workspace/examples/ssr/lib/*.react.*
        TMP=.tmp dart run build_runner build --workspace
        for f in .dart_tool/build/generated/react_workspace/examples/ssr/lib/*.react.dart; do
          [ -f "$f" ] && cp "$f" examples/ssr/lib/
        done
        for f in .dart_tool/build/generated/react_workspace/examples/ssr/lib/*.react.g.dart; do
          [ -f "$f" ] && cp "$f" examples/ssr/lib/
        done

  ssr:
    desc: Compile SSR JavaScript
    cmds:
      - rm -f build/ssr.js
      - dart compile js -O0 -o build/ssr.js examples/ssr/lib/ssr.dart

  client:
    desc: Compile client JavaScript
    cmds:
      - rm -f examples/ssr/web/callback_trampoline.mjs
      - cp packages/react_js/js/callback_trampoline.mjs examples/ssr/web/callback_trampoline.mjs
      - dart compile js -O0 -o examples/ssr/web/client.js examples/ssr/web/client.dart

  build:
    desc: Full build (generate + ssr + client)
    cmds:
      - task: generate
      - task: ssr
      - task: client

  serve:
    desc: Full build + start demo server (http://localhost:8080)
    deps: [build]
    cmds:
      - fuser -k 3001/tcp 2>/dev/null || true
      - fuser -k 8080/tcp 2>/dev/null || true
      - sleep 1
      - dart run bin/dev.dart

  dev:
    desc: Quick restart dev server (no rebuild)
    cmds:
      - fuser -k 3001/tcp 2>/dev/null || true
      - fuser -k 8080/tcp 2>/dev/null || true
      - sleep 1
      - dart run bin/dev.dart

  client-serve:
    desc: Client-only mode - build client and serve examples/ssr/web
    cmds:
      - task: client
      - fuser -k 8080/tcp 2>/dev/null || true
      - sleep 1
      - python3 -m http.server 8080 --directory examples/ssr/web

  analyze:
    desc: Run dart analyze
    cmds:
      - dart analyze

  verify:
    desc: Verify full Web IDL completeness (dropped = 0, no duplicate names)
    cmds:
      - dart run tool/web_idl/verify.dart

  verify-strict:
    desc: Verify completeness + package:web mapping coverage (requires pinned package:web)
    cmds:
      - dart run tool/web_idl/verify.dart --strict

  clean:
    desc: Remove compiled and generated files
    cmds:
      - rm -f build/ssr.js examples/ssr/web/client.js
      - rm -f examples/ssr/lib/*.react.dart examples/ssr/lib/*.react.g.dart
      - rm -f examples/ssr/lib/react_components.g.dart
      - rm -rf .dart_tool/build/generated

  status:
    desc: Show build status and test SSR
    cmds:
      - |
        echo "=== Build Status ==="
        if [ -f build/ssr.js ]; then
          echo "  SSR:  build/ssr.js ($(wc -c < build/ssr.js | tr -d ' ') bytes)"
        else
          echo "  SSR:  not built"
        fi
        if [ -f examples/ssr/web/client.js ]; then
          echo "  Client: examples/ssr/web/client.js ($(wc -c < examples/ssr/web/client.js | tr -d ' ') bytes)"
        else
          echo "  Client: not built"
        fi
        echo ""
        echo "=== Generated Files ==="
        ls -1 examples/ssr/lib/*.react.* 2>/dev/null || echo "  (none)"
        ls -1 examples/ssr/lib/react_components.g.dart 2>/dev/null || echo "  (no aggregate)"
        echo ""
        echo "=== SSR Test ==="
        curl -s -X POST http://localhost:3001 -H 'Content-Type: application/json' \
          -d '{"id":"package:react_workspace/examples/ssr/lib/app.dart#App","props":{"title":"OK"}}' 2>/dev/null \
          || echo "  (SSR worker not running on port 3001)"
